name: .NET CI

on:
  push:
    branches: [ task07 ]
  pull_request:
    branches: [ task07 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore practice2025.slnx

    - name: Build
      run: dotnet build practice2025.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test practice2025.slnx --no-build --verbosity normal